jog:
  target:
    entity:
      integration: updown_desk
      domain: cover
  fields:
    direction:
      required: true
      example: up
      selector:
        select:
          options:
            - up
            - down
    duration:
      required: false
      default: 0.5
      example: 0.5
      selector:
        number:
          min: 0.05
          max: 3
          step: 0.05
          unit_of_measurement: s
          mode: box
